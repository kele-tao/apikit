name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m apikit --help
      - run: python -m apikit diff examples/petstore.v1.json examples/petstore.v2.json --format md --fail-on none
      - run: python -m apikit diff examples/petstore.v1.json examples/petstore.v2.json --fail-on breaking --format json > /dev/null || test $? -eq 1
